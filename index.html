<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LGD-Gate</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 80px 20px;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 20px;
        }
        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 40px 0;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }
        .btn-github { background: #24292e; color: white; }
        .btn-leaderboard { background: #0969da; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚪 LGD-Gate</h1>
        <p style="font-size: 1.2rem; color: #586069; margin-bottom: 20px;">
            Independent Trust Evaluation for AI Agent Skills
        </p>
        <div class="buttons">
            <a href="https://github.com/LGD-Eval/lgd-gate" class="btn btn-github">📦 GitHub</a>
            <a href="https://github.com/LGD-Eval/lgd-gate#-current-leaderboard" class="btn btn-leaderboard">📊 Leaderboard</a>
        </div>
        <p>Independent · Transparent · Trustworthy</p>
    </div>
</body>
</html>
