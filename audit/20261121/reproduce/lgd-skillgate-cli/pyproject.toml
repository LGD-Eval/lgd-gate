[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lgd-skillgate"
version = "0.1.0"
description = "Offline static scanner for AI agent skills (SKILL.md / scripts), with stable rule IDs and JSON/SARIF output."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "LGD-Eval" }]
keywords = ["agent", "skill", "security", "static-analysis", "scanner"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Security",
]

[project.scripts]
lgd-skillgate = "lgd_skillgate.cli:run"

[tool.setuptools]
packages = ["lgd_skillgate"]
